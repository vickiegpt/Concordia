[package]
name = "sifive_comgr_sys"
version = "0.1.0"
edition = "2024"
description = "Rust bindings for SIFIVE (RISC-V IME) Compiler using LLVM VCIX backend"
license = "MIT"
authors = ["ZLUDA Team"]

[dependencies]
tempfile = "3.4.0"
lazy_static = "1.4.0"
regex = "1.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
which = "8.0.0"

[lib]
name = "sifive_comgr_sys"
path = "src/lib.rs"
